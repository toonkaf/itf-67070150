    <h2 class="head">Add Phone Number List</h2>
    <label class="head">Name : </label><input type="text" id="names"><label class="head"> Tel : </label><input type="text" id="tels"> <button class="head" onclick="addParagraph()">set</button>  <button class="head" onclick="saveCSV()">export</button>
    <table class="table-tel" id="table">

</center>

        let count = 0;
        var phonenumber = [];
        const username = document.getElementById("user");
        const input = document.getElementById("name");
        const input_2 = document.getElementById("image");
        const newdiv = document.getElementsByClassName("container")[0];
        function setName(){
            username.textContent = input.value + "'s Phone Book";
        }
        function setProfile(){
            profile.style.backgroundImage = "url(" + input_2.value +")";
        }
        function addParagraph(){
            count += 1;
            const row = document.createElement("tr");
            const cellNo = document.createElement("td");
            const cellName = document.createElement("td");
            const cellTel = document.createElement("td");
            cellNo.textContent = count;
            cellName.textContent = document.getElementById("names").value;
            cellTel.textContent = document.getElementById("tels").value;

            table.appendChild(row);

            arr.push(count);

            arr.push(document.getElementById("tels").value);
            phonenumber.push(arr);
            console.log(phonenumber);

            document.getElementById("names").value = "";
            document.getElementById("tels").value = "";
        }
        function saveCSV() 
        {
        const csvContent = phonenumber.map(row => row.join(",")).join("\n"); // Convert array to CSV string
        const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
        const link = document.createElement("a");
        const url = URL.createObjectURL(blob);
        link.setAttribute("href", url);
        link.setAttribute("download", "data.csv");
        link.style.visibility = "hidden";
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        }
